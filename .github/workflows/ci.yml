name: CI

# Validates every push / PR to main: installs, lints, type-checks via the
# production build, and runs the test suite. Keeps the manually-committed
# /docs build in sync with /src by failing if docs is stale.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

      - name: Ensure committed /docs is up to date
        run: |
          # Rebuild and confirm docs/ matches the new build for the key entry files.
          npm run build >/dev/null
          if ! git diff --quiet -- docs/index.html docs/assets; then
            echo "::error::docs/ is out of sync with the build. Run 'npm run build' and commit /docs."
            git diff --stat -- docs/index.html docs/assets
            exit 1
          fi
          echo "docs/ is in sync with src."

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs against a LOCAL preview of the production build (Playwright webServer),
    # so it validates the real app deterministically without depending on the
    # Cloudflare Pages deploy.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (navigation, a11y, perf, Phase A features)
        run: npm run test:e2e
        env:
          CI: 'true'
