name: Edge Headers

# Applies the edge security headers from public/_headers to Cloudflare as a
# Transform Rule. Runs on demand (workflow_dispatch) and automatically when
# public/_headers changes on main — keeping the live edge in sync with source.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/_headers'
      - 'scripts/apply_edge_headers.py'
      - '.github/workflows/edge-headers.yml'

permissions:
  contents: read

concurrency:
  group: edge-headers
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply Cloudflare Transform Rule from public/_headers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/apply_edge_headers.py
