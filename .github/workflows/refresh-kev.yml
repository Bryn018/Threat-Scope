name: Refresh CISA KEV feed

# Keeps docs/data/cisa-kev.json (served by the live site) current by
# downloading the official CISA Known Exploited Vulnerabilities catalog
# server-side (the GitHub runner is NOT subject to browser CORS), then
# committing the updated file so GitHub Pages redeploys automatically.
on:
  schedule:
    # Hourly, at a non-round minute to avoid the :00 stampede.
    - cron: '23 * * * *'
  # Allow a manual run from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download latest CISA KEV catalog
        run: |
          set -euo pipefail
          URL="https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          curl -fsSL "$URL" -o public/data/cisa-kev.json
          curl -fsSL "$URL" -o docs/data/cisa-kev.json

      - name: Sanity check + report freshness
        run: |
          python3 - <<'PY'
          import json, sys
          for p in ("public/data/cisa-kev.json", "docs/data/cisa-kev.json"):
              with open(p) as f:
                  d = json.load(f)
              vulns = d.get("vulnerabilities", [])
              assert isinstance(vulns, list) and len(vulns) > 500, f"{p}: suspiciously small dataset"
              print(p, "-> catalogVersion", d.get("catalogVersion"), "| count", len(vulns))
          PY

      - name: Commit and push if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if ! git diff --quiet; then
            git add public/data/cisa-kev.json docs/data/cisa-kev.json
            git commit -m "chore: auto-refresh CISA KEV catalog"
            git push
            echo "Pushed updated catalog."
          else
            echo "No changes; catalog already current."
          fi
