name: Sync threat-intel feeds

# Mirrors external threat-intel sources SERVER-SIDE (the GitHub runner is not
# subject to browser CORS) into /data/*.json so the static site can load them
# from its own origin — making every page real, authentic and self-updating.
#
# Sources mirrored:
#   - CISA KEV catalog            -> data/cisa-kev.json        (hourly)
#   - EPSS exploit-probability     -> data/epss-scores.json      (hourly, keyed to KEV CVEs)
#   - MITRE ATT&CK STIX (enterprise) -> data/attack-enterprise.json (daily)
#   - Exploit-DB (Offensive Security) -> data/exploit-db.json (every 6h)
#   - CISA advisories + news RSS  -> data/cisa-advisories.json + data/cisa-news.json (every 3h)
#
# Derived/curated artifacts:
#   - data/technique-map.json      (CWE -> ATT&CK techniques, rebuilt with ATT&CK)
#   - data/exploits-by-cve.json    (CVE -> [exploit ids], rebuilt with Exploit-DB)
#
# Each fetch is sanity-checked before it is allowed to replace the committed
# file, so a broken/incomplete upstream response can never wipe good data.

on:
  schedule:
    - cron: '23 * * * *'      # CISA KEV (hourly)
    - cron: '17 */6 * * *'    # Exploit-DB (every 6h)
    - cron: '11 */3 * * *'    # CISA advisories/news (every 3h)
    - cron: '47 2 * * *'      # MITRE ATT&CK (daily, 02:47 UTC)
  workflow_dispatch:
    inputs:
      feed:
        description: 'Which feed to sync (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-threat-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync CISA KEV catalog + EPSS scores
        if: ${{ github.event.schedule == '23 * * * *' || github.event_name == 'workflow_dispatch' && (inputs.feed == '' || inputs.feed == 'kev') }}
        run: |
          set -euo pipefail
          URL="https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          curl -fsSL "$URL" -o public/data/cisa-kev.json
          curl -fsSL "$URL" -o docs/data/cisa-kev.json
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          for p in ("public/data/cisa-kev.json","docs/data/cisa-kev.json"):
              d=json.load(open(p))
              assert len(d.get("vulnerabilities",[]))>500, f"{p}: suspicious dataset"
              print(p,"-> catalogVersion",d.get("catalogVersion"),"|",len(d["vulnerabilities"]),"CVEs")

          # EPSS: exploit-probability for each KEV CVE (FIRST.org public API, no key).
          # Batched 100/req. Result is a flat {cve: {epss, percentile, date}} map.
          cves=[v["cveID"] for v in d["vulnerabilities"]]
          assert len(cves)>500, "too few CVEs for EPSS"
          scores={}
          for i in range(0,len(cves),100):
              batch=cves[i:i+100]
              q="https://api.first.org/data/v1/epss?cve="+",".join(batch)
              req=urllib.request.Request(q, headers={"User-Agent":"ThreatScopeBot/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  body=json.load(r)
              for row in body.get("data",[]):
                  scores[row["cve"]]={
                      "epss": float(row["epss"]),
                      "percentile": float(row["percentile"]),
                      "date": row.get("date",""),
                  }
              time.sleep(0.3)
          # Cache the full EPSS map site-wide (used by KEV dashboard + exports).
          for p in ("public/data/epss-scores.json","docs/data/epss-scores.json"):
              json.dump(scores, open(p,"w"), separators=(",",":"))
          covered=len([c for c in cves if c in scores])
          print("epss-scores.json ->",len(scores),"scores |",covered,"/",len(cves),"KEVs covered")
          assert covered>500, "EPSS coverage suspiciously low"
          PY

      - name: Sync MITRE ATT&CK (enterprise)
        if: ${{ github.event.schedule == '47 2 * * *' || github.event_name == 'workflow_dispatch' && (inputs.feed == '' || inputs.feed == 'attack') }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json"
          curl -fsSL "$URL" -o public/data/attack-enterprise.json.tmp
          # Keep only what the site needs; drop the giant raw STIX to a slim curated copy.
          python3 - <<'PY'
          import json
          raw=json.load(open("public/data/attack-enterprise.json.tmp"))
          objs=raw.get("objects",[])
          techniques=[]
          cwe_to_techniques={}   # CWE -> [ {id,name,tactic} ] for KEV exposure correlation
          for o in objs:
              if o.get("type")=="attack-pattern" and not o.get("x_mitre_is_subtechnique") and o.get("revoked") is not True and not o.get("x_mitre_deprecated"):
                  ph=[p.get("phase_name") for p in o.get("kill_chain_phases",[]) if p.get("kill_chain_name")=="mitre-attack"]
                  ref=o.get("external_references",[{}])
                  ext_id=ref[0].get("external_id","") if ref else ""
                  weaknesses=o.get("x_mitre_related_weaknesses",[])
                  techniques.append({
                      "id": ext_id,
                      "name": o.get("name",""),
                      "description": (o.get("description") or "")[:600],
                      "tactics": ph,
                      "url": ref[0].get("url","") if ref else "",
                      "platforms": o.get("x_mitre_platforms",[]),
                      "detection": (o.get("x_mitre_detection") or "")[:600],
                      "weaknesses": weaknesses,
                  })
                  for cwe in weaknesses:
                      cwe_to_techniques.setdefault(cwe,[]).append({
                          "id": ext_id, "name": o.get("name",""),
                          "tactic": ph[0] if ph else "Other",
                      })
          assert len(techniques)>150, "too few techniques"
          json.dump({"techniques":techniques},open("public/data/attack-enterprise.json","w"),separators=(",",":"))
          json.dump(cwe_to_techniques,open("public/data/technique-map.json","w"),separators=(",",":"))
          print("attack-enterprise.json ->",len(techniques),"techniques")
          print("technique-map.json ->",len(cwe_to_techniques),"CWEs mapped")
          PY
          rm -f public/data/attack-enterprise.json.tmp
          cp public/data/attack-enterprise.json docs/data/attack-enterprise.json
          cp public/data/technique-map.json docs/data/technique-map.json

      - name: Sync Exploit-DB
        if: ${{ github.event.schedule == '17 */6 * * *' || github.event_name == 'workflow_dispatch' && (inputs.feed == '' || inputs.feed == 'exploit') }}
        run: |
          set -euo pipefail
          URL="https://gitlab.com/exploit-database/exploitdb/-/raw/main/files_exploits.csv"
          curl -fsSL "$URL" -o public/data/exploit-db.csv
          python3 - <<'PY'
          import csv,json
          rows=[]
          with open("public/data/exploit-db.csv",newline="",encoding="utf-8") as f:
              r=csv.DictReader(f)
              for row in r:
                  codes=(row.get("codes") or "")
                  cve=""
                  for c in codes.split(";"):
                      if c.startswith("CVE-"):
                          cve=c; break
                  rows.append({
                      "id": row.get("id",""),
                      "description": (row.get("description") or "")[:300],
                      "date": row.get("date_published",""),
                      "author": row.get("author",""),
                      "type": row.get("type","unknown"),
                      "platform": row.get("platform",""),
                      "verified": (row.get("verified")=="1"),
                      "cve": cve,
                  })
          assert len(rows)>40000, "too few exploits"
          json.dump({"exploits":rows,"total":len(rows)},open("public/data/exploit-db.json","w"),separators=(",",":"))
          # CVE -> [exploit refs] index for fast KEV<->exploit correlation.
          by_cve={}
          for r in rows:
              if r["cve"]:
                  by_cve.setdefault(r["cve"],[]).append({"id":r["id"],"description":r["description"],"verified":r["verified"]})
          json.dump(by_cve,open("public/data/exploits-by-cve.json","w"),separators=(",",":"))
          print("exploit-db.json ->",len(rows),"exploits | exploits-by-cve.json ->",len(by_cve),"CVEs")
          PY
          cp public/data/exploit-db.json docs/data/exploit-db.json
          cp public/data/exploits-by-cve.json docs/data/exploits-by-cve.json
          rm -f public/data/exploit-db.csv

      - name: Sync CISA advisories + news RSS
        if: ${{ github.event.schedule == '11 */3 * * *' || github.event_name == 'workflow_dispatch' && (inputs.feed == '' || inputs.feed == 'cisa') }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          def fetch(url):
              req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 ThreatScopeBot/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()
          def items(xml_bytes):
              root=ET.fromstring(xml_bytes)
              out=[]
              for it in root.iter("item"):
                  def g(t):
                      e=it.find(t)
                      return (e.text or "").strip() if e is not None else ""
                  out.append({
                      "title": g("title"),
                      "link": g("link"),
                      "description": (g("description") or "")[:400],
                      "pubDate": g("pubDate") or g("date"),
                      "guid": g("guid") or g("link"),
                  })
              return out[:30]
          adv=items(fetch("https://www.cisa.gov/cybersecurity-advisories/cybersecurity-advisories.xml"))
          news=items(fetch("https://www.cisa.gov/news.xml"))
          assert len(adv)>0 and len(news)>0, "empty CISA feed"
          json.dump(adv, open("public/data/cisa-advisories.json","w"), separators=(",",":"))
          json.dump(news, open("public/data/cisa-news.json","w"), separators=(",",":"))
          print("cisa-advisories.json ->",len(adv),"| cisa-news.json ->",len(news))
          PY
          cp public/data/cisa-advisories.json docs/data/cisa-advisories.json
          cp public/data/cisa-news.json docs/data/cisa-news.json

      - name: Commit and push if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/data docs/data
          if ! git diff --cached --quiet; then
            git commit -m "data: auto-sync threat-intel feeds"
            git push
            echo "Pushed updated data."
          else
            echo "No data changes."
          fi
