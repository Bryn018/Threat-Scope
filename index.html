<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Threat Scope — Professional SOC dashboard for CISA KEV vulnerabilities, CVE exploration, MITRE ATT&CK matrix, threat intelligence, IOC lookup, and exploit tracking." />
    <meta name="author" content="Insights Security" />
    <meta name="theme-color" content="#020617" />
    <meta name="robots" content="index, follow" />
    <!-- No-flash theme: apply persisted/OS theme before paint -->
    <script>
      (function () {
        try {
          var k = 'threatscope-theme'
          var s = localStorage.getItem(k)
          var t = s === 'light' || s === 'dark'
            ? s
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          if (t === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = t
        } catch (e) {}
      })()
    </script>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; connect-src 'self' https://services.nvd.nist.gov; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Threat Scope — SOC Security Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
